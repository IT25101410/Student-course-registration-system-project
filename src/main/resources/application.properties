spring.application.name=student-course-management-system
# Database Configuration
spring.datasource.url: jdbc:mysql://localhost:3306/shadow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Root@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# App Configuration

server.port=8081

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML

# Disable whitelabel error page
spring.web.error.whitelabel.enabled=false

# Logging for debugging
logging.level.org.springframework.web=DEBUG
logging.level.com.sliit.scrs=DEBUG

# Admin User
spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMIN
