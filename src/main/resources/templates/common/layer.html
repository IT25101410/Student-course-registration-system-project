<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title} + ' | SCMS'">SCMS | Student Course Management System</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet"/>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

    <style>
        /* ========== CSS CUSTOM PROPERTIES ========== */
        :root {
            /* Brand Colors */
            --brand: #6c5ce7;
            --brand-dark: #5a4bd1;
            --brand-light: rgba(108, 92, 231, 0.08);
            --brand-glow: rgba(108, 92, 231, 0.3);
            --accent: #a29bfe;
            --accent-glow: rgba(162, 155, 254, 0.4);

            /* Status Colors */
            --success: #00cec9;
            --success-glow: rgba(0, 206, 201, 0.3);
            --danger: #ff7675;
            --danger-light: rgba(255, 118, 117, 0.08);
            --danger-glow: rgba(255, 118, 117, 0.3);
            --warning: #fdcb6e;
            --warning-light: rgba(253, 203, 110, 0.1);
            --warning-glow: rgba(253, 203, 110, 0.3);
            --info: #74b9ff;
            --info-light: rgba(116, 185, 255, 0.1);

            /* Theme Colors */
            --student-color: #6c5ce7;
            --student-light: rgba(108, 92, 231, 0.1);
            --course-color: #00cec9;
            --course-light: rgba(0, 206, 201, 0.1);
            --enrollment-color: #a29bfe;
            --enrollment-light: rgba(162, 155, 254, 0.1);
            --lecturer-color: #fd79a8;
            --lecturer-light: rgba(253, 121, 168, 0.1);
            --payment-color: #00b894;
            --payment-light: rgba(0, 184, 148, 0.1);

            /* Surfaces */
            --surface: #ffffff;
            --surface-2: #f8f9fe;
            --surface-glass: rgba(255, 255, 255, 0.7);

            /* Text */
            --text: #2d3436;
            --text-muted: #636e72;
            --text-light: #b2bec3;

            /* Borders */
            --border: rgba(0, 0, 0, 0.04);
            --border-solid: #dfe6e9;

            /* Gradients */
            --gradient-primary: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
            --gradient-success: linear-gradient(135deg, #00cec9 0%, #81ecec 100%);
            --gradient-danger: linear-gradient(135deg, #ff7675 0%, #fab1a0 100%);
            --gradient-warning: linear-gradient(135deg, #fdcb6e 0%, #ffeaa7 100%);
            --gradient-sidebar: linear-gradient(180deg, #2d1b69 0%, #1a0533 50%, #0d0221 100%);
            --gradient-card: linear-gradient(145deg, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.7) 100%);

            /* Layout */
            --sidebar-width: 280px;

            /* Animation */
            --transition: cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --bounce: cubic-bezier(0.68, -0.55, 0.265, 1.55);
            --spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            color: var(--text);
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            position: relative;
        }

        /* Enhanced animated background with floating particles */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background:
                    radial-gradient(circle at 20% 50%, rgba(108, 92, 231, 0.04) 0%, transparent 50%),
                    radial-gradient(circle at 80% 20%, rgba(0, 206, 201, 0.04) 0%, transparent 50%),
                    radial-gradient(circle at 40% 80%, rgba(255, 118, 117, 0.04) 0%, transparent 50%),
                    radial-gradient(circle at 70% 60%, rgba(253, 203, 110, 0.04) 0%, transparent 50%);
            animation: backgroundFloat 25s ease-in-out infinite;
            z-index: -1;
            pointer-events: none;
        }

        /* Floating particles overlay */
        body::after {
            content: '';
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background-image:
                    radial-gradient(2px 2px at 20px 30px, rgba(108, 92, 231, 0.3), transparent),
                    radial-gradient(2px 2px at 40px 70px, rgba(255, 255, 255, 0.8), transparent),
                    radial-gradient(2px 2px at 50px 160px, rgba(108, 92, 231, 0.3), transparent),
                    radial-gradient(2px 2px at 90px 40px, rgba(255, 255, 255, 0.6), transparent),
                    radial-gradient(2px 2px at 130px 80px, rgba(162, 155, 254, 0.4), transparent),
                    radial-gradient(2px 2px at 160px 120px, rgba(255, 255, 255, 0.7), transparent);
            background-size: 200px 200px;
            animation: particleFloat 20s linear infinite;
            z-index: -1;
            pointer-events: none;
            opacity: 0.6;
        }

        @keyframes backgroundFloat {
            0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
            25% { transform: translate(3%, 2%) rotate(1deg) scale(1.02); }
            50% { transform: translate(-2%, -1%) rotate(-1deg) scale(0.98); }
            75% { transform: translate(1%, -2%) rotate(0.5deg) scale(1.01); }
        }

        @keyframes particleFloat {
            0% { background-position: 0 0; }
            100% { background-position: 200px 200px; }
        }

        .skip-link {
            position: absolute;
            top: -100px;
            left: 16px;
            background: var(--gradient-primary);
            color: #fff;
            padding: 14px 24px;
            border-radius: 10px;
            z-index: 999;
            font-weight: 700;
            font-family: 'DM Sans', sans-serif;
            transition: top 0.3s var(--bounce);
            box-shadow: 0 8px 24px var(--brand-glow);
            text-decoration: none;
            font-size: 0.95rem;
        }

        .skip-link:focus {
            top: 16px;
        }

        /* ========== SIDEBAR - Enhanced Premium ========== */
        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--gradient-sidebar);
            position: fixed;
            left: 0;
            top: 0;
            display: flex;
            flex-direction: column;
            z-index: 50;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 4px 0 30px rgba(0, 0, 0, 0.3);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.4s var(--spring);
            overflow: hidden;
        }

        /* Animated gradient orbs in sidebar */
        .sidebar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                    radial-gradient(circle at 30% 10%, rgba(108, 92, 231, 0.25) 0%, transparent 50%),
                    radial-gradient(circle at 70% 80%, rgba(162, 155, 254, 0.2) 0%, transparent 50%),
                    radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.05) 0%, transparent 50%);
            animation: particleShift 8s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes particleShift {
            0%, 100% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        .sidebar .logo {
            padding: 1.75rem 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 1.3rem;
            color: #fff;
            text-decoration: none;
            cursor: pointer;
            transition: opacity 0.2s;
            position: relative;
            z-index: 1;
        }

        .sidebar .logo:hover {
            opacity: 0.9;
        }

        .sidebar .logo-icon {
            width: 42px;
            height: 42px;
            background: var(--gradient-primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 1.2rem;
            box-shadow: 0 8px 20px var(--brand-glow);
            animation: logoPulse 3s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 8px 20px var(--brand-glow); }
            50% { transform: scale(1.08); box-shadow: 0 12px 30px var(--brand-glow), 0 0 40px rgba(108, 92, 231, 0.4); }
        }

        .sidebar-nav {
            flex: 1;
            padding: 1.25rem 0.75rem;
            overflow-y: auto;
            position: relative;
            z-index: 1;
        }

        .sidebar-nav::-webkit-scrollbar { width: 4px; }
        .sidebar-nav::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }
        .sidebar-nav::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); }
        .sidebar-nav::-webkit-scrollbar-track { background: transparent; }

        .sidebar-nav-section {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: rgba(255, 255, 255, 0.4);
            padding: 1.5rem 1rem 0.75rem;
            margin-top: 0.5rem;
            transition: color 0.3s;
        }

        .sidebar-nav-section:hover {
            color: rgba(255, 255, 255, 0.6);
        }

        .sidebar a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0.85rem 1rem;
            margin-bottom: 0.25rem;
            border-radius: 12px;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s var(--spring);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .sidebar a::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }

        .sidebar a:hover::before {
            transform: translateX(100%);
        }

        .sidebar a:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            transform: translateX(6px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .sidebar a.active {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            font-weight: 600;
            box-shadow: 0 4px 20px rgba(108, 92, 231, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .sidebar a i, .sidebar a svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            opacity: 0.7;
            transition: all 0.3s var(--bounce);
        }

        .sidebar a:hover i, .sidebar a:hover svg {
            opacity: 1;
            transform: scale(1.15) rotate(5deg);
            color: var(--accent);
            filter: drop-shadow(0 0 8px var(--accent-glow));
        }

        .sidebar a.active i, .sidebar a.active svg {
            opacity: 1;
            color: var(--accent);
            animation: iconGlow 2s ease-in-out infinite;
        }

        @keyframes iconGlow {
            0%, 100% {
                filter: drop-shadow(0 0 8px rgba(162, 155, 254, 0.5));
            }
            50% {
                filter: drop-shadow(0 0 16px rgba(162, 155, 254, 0.8)) drop-shadow(0 0 24px rgba(162, 155, 254, 0.4));
            }
        }

        .sidebar-footer {
            padding: 1rem 0.75rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 1;
        }

        .sidebar-user {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0.5rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .sidebar-user:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateX(4px);
        }

        .sidebar-user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            color: white;
            box-shadow: 0 4px 12px var(--brand-glow);
            transition: all 0.3s;
        }

        .sidebar-user:hover .sidebar-user-avatar {
            transform: scale(1.1);
            box-shadow: 0 8px 20px var(--brand-glow);
        }

        .sidebar-user-info { flex: 1; }
        .sidebar-user-name { font-size: 0.85rem; font-weight: 600; color: #fff; }
        .sidebar-user-role { font-size: 0.75rem; color: rgba(255, 255, 255, 0.6); }

        /* ========== HAMBURGER MENU - Enhanced ========== */
        .hamburger {
            display: none;
            position: fixed;
            top: 1rem;
            left: 1rem;
            z-index: 100;
            background: var(--surface-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            width: 46px;
            height: 46px;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: all 0.3s var(--bounce);
            padding: 0;
        }

        .hamburger:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        .hamburger:active {
            transform: scale(0.95);
        }

        .hamburger span {
            display: block;
            width: 22px;
            height: 2px;
            background: var(--text);
            border-radius: 2px;
            position: relative;
            transition: all 0.3s var(--spring);
        }

        .hamburger span::before,
        .hamburger span::after {
            content: '';
            position: absolute;
            width: 22px;
            height: 2px;
            background: var(--text);
            border-radius: 2px;
            transition: all 0.3s var(--spring);
        }

        .hamburger span::before { top: -7px; }
        .hamburger span::after { top: 7px; }

        .hamburger.open span {
            background: transparent;
        }

        .hamburger.open span::before {
            top: 0;
            transform: rotate(45deg);
        }

        .hamburger.open span::after {
            top: 0;
            transform: rotate(-45deg);
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(26, 26, 46, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 40;
            opacity: 0;
            transition: opacity 0.3s ease-out;
        }

        .sidebar-overlay.show {
            display: block;
            opacity: 1;
        }

        /* ========== MAIN CONTENT ========== */
        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            min-height: 100vh;
            padding: 2rem 3rem;
            position: relative;
            animation: contentSlideIn 0.8s var(--spring);
        }

        @keyframes contentSlideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
                filter: blur(5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 1024px) {
            .sidebar {
                transform: translateX(-100%);
                box-shadow: none;
            }

            .sidebar.open {
                transform: translateX(0);
                box-shadow: 8px 0 40px rgba(0, 0, 0, 0.3);
            }

            .main-content {
                margin-left: 0;
                padding: 5.5rem 2rem 2rem;
            }

            .hamburger {
                display: flex;
            }
        }

        @media (max-width: 640px) {
            .main-content {
                padding: 5rem 1rem 1rem;
            }

            :root {
                --sidebar-width: 260px;
            }
        }

        /* ========== PRINT ========== */
        @media print {
            .sidebar, .hamburger, .sidebar-overlay {
                display: none !important;
            }

            .main-content {
                margin-left: 0;
                padding: 0;
            }

            body {
                background: white;
            }

            body::before, body::after {
                display: none;
            }
        }

        /* ========== COMMON COMPONENTS - Enhanced ========== */
        .card {
            background: var(--surface-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 2rem;
            box-shadow:
                    0 8px 32px rgba(0, 0, 0, 0.06),
                    0 2px 8px rgba(0, 0, 0, 0.04),
                    inset 0 1px 0 rgba(255, 255, 255, 0.6);
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: all 0.5s var(--spring);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg,
            transparent,
            rgba(255, 255, 255, 0.3),
            rgba(255, 255, 255, 0.5),
            rgba(255, 255, 255, 0.3),
            transparent);
            transition: left 0.8s;
            z-index: 1;
            pointer-events: none;
        }

        .card::after {
            content: '';
            position: absolute;
            inset: -2px;
            background: linear-gradient(45deg,
            transparent,
            rgba(108, 92, 231, 0.1),
            rgba(162, 155, 254, 0.1),
            transparent);
            border-radius: 26px;
            opacity: 0;
            transition: opacity 0.5s;
            z-index: -1;
        }

        .card:hover::before {
            left: 100%;
        }

        .card:hover::after {
            opacity: 1;
        }

        .card:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow:
                    0 24px 64px rgba(0, 0, 0, 0.12),
                    0 8px 24px rgba(108, 92, 231, 0.1),
                    inset 0 1px 0 rgba(255, 255, 255, 0.9);
            border-color: rgba(108, 92, 231, 0.3);
        }

        .btn {
            padding: 10px 20px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.4s var(--bounce);
            font-family: 'DM Sans', sans-serif;
            letter-spacing: -0.2px;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            transform: translate(-50%, -50%);
            transition: width 0.8s, height 0.8s;
            z-index: -1;
        }

        .btn:hover::before {
            width: 400px;
            height: 400px;
        }

        .btn:active {
            transform: scale(0.9);
            transition: transform 0.1s var(--bounce);
        }

        .btn-primary {
            background: var(--gradient-primary);
            color: #fff;
            box-shadow: 0 8px 24px var(--brand-glow);
        }

        .btn-primary:hover {
            box-shadow: 0 12px 36px var(--brand-glow);
            transform: translateY(-3px);
            filter: brightness(1.1);
        }

        .btn-success {
            background: var(--gradient-success);
            color: #fff;
            box-shadow: 0 8px 24px var(--success-glow);
        }

        .btn-success:hover {
            box-shadow: 0 12px 36px var(--success-glow);
            transform: translateY(-3px);
            filter: brightness(1.1);
        }

        .btn-danger {
            background: var(--gradient-danger);
            color: #fff;
            box-shadow: 0 8px 24px var(--danger-glow);
        }

        .btn-danger:hover {
            box-shadow: 0 12px 36px var(--danger-glow);
            transform: translateY(-3px);
            filter: brightness(1.1);
        }

        .badge {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            white-space: nowrap;
            transition: all 0.4s var(--bounce);
            position: relative;
            overflow: hidden;
        }

        .badge::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transform: translateX(-100%);
            transition: transform 0.5s;
        }

        .badge:hover::before {
            transform: translateX(100%);
        }

        .badge:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        }

        .badge-primary {
            background: var(--student-light);
            color: var(--brand);
            border: 1px solid rgba(108, 92, 231, 0.3);
        }

        .badge-success {
            background: var(--course-light);
            color: #00897b;
            border: 1px solid rgba(0, 206, 201, 0.3);
        }

        .badge-warning {
            background: var(--warning-light);
            color: #f39c12;
            border: 1px solid rgba(253, 203, 110, 0.3);
        }

        .badge-danger {
            background: var(--danger-light);
            color: #d63031;
            border: 1px solid rgba(255, 118, 117, 0.3);
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: 20px;
            background: var(--surface-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        thead {
            background: linear-gradient(180deg, rgba(108, 92, 231, 0.08) 0%, transparent 100%);
            position: relative;
        }

        thead::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg,
            transparent,
            rgba(108, 92, 231, 0.3),
            rgba(162, 155, 254, 0.3),
            transparent);
        }

        th {
            text-align: left;
            padding: 16px 20px;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid rgba(108, 92, 231, 0.1);
            white-space: nowrap;
            position: relative;
            transition: color 0.3s;
        }

        th:hover {
            color: var(--brand);
        }

        td {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            color: var(--text);
            transition: all 0.3s;
        }

        tbody tr {
            transition: all 0.4s var(--spring);
            position: relative;
        }

        tbody tr::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 4px;
            height: 100%;
            background: var(--gradient-primary);
            opacity: 0;
            transition: all 0.3s;
            border-radius: 0 2px 2px 0;
        }

        tbody tr:hover {
            background: rgba(108, 92, 231, 0.05);
            transform: scale(1.01);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        tbody tr:hover::before {
            opacity: 1;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 12px 16px;
            border: 2px solid rgba(0, 0, 0, 0.08);
            border-radius: 14px;
            font-size: 14px;
            color: var(--text);
            background: var(--surface-glass);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s var(--transition);
            font-family: 'DM Sans', sans-serif;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--brand);
            box-shadow:
                    0 0 0 4px var(--brand-light),
                    inset 0 2px 4px rgba(0, 0, 0, 0.02),
                    0 4px 12px rgba(108, 92, 231, 0.1);
            transform: translateY(-1px);
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .page-header h1 {
            font-size: 32px;
            font-weight: 800;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
            font-family: 'Syne', sans-serif;
            animation: titleShine 3s ease-in-out infinite;
        }

        @keyframes titleShine {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.2); }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .stat-card {
            background: var(--surface-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 1.75rem;
            box-shadow:
                    0 8px 32px rgba(0, 0, 0, 0.06),
                    0 2px 8px rgba(0, 0, 0, 0.04),
                    inset 0 1px 0 rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: all 0.5s var(--spring);
            cursor: pointer;
            animation: cardEntrance 0.8s var(--spring) backwards;
            position: relative;
            overflow: hidden;
        }

        .stat-card:nth-child(1) { animation-delay: 0.1s; }
        .stat-card:nth-child(2) { animation-delay: 0.2s; }
        .stat-card:nth-child(3) { animation-delay: 0.3s; }
        .stat-card:nth-child(4) { animation-delay: 0.4s; }

        @keyframes cardEntrance {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.9) rotateX(10deg);
                filter: blur(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1) rotateX(0);
                filter: blur(0);
            }
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, var(--brand-light) 0%, transparent 70%);
            opacity: 0;
            transition: all 0.6s var(--transition);
            z-index: 1;
            pointer-events: none;
        }

        .stat-card::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100px;
            height: 100px;
            background: var(--brand-light);
            border-radius: 0 0 0 100%;
            opacity: 0.2;
            transition: all 0.5s var(--spring);
            z-index: 1;
            pointer-events: none;
        }

        .stat-card:hover::before {
            opacity: 1;
            top: -30%;
            right: -30%;
        }

        .stat-card:hover {
            transform: translateY(-10px) scale(1.03);
            box-shadow:
                    0 24px 64px rgba(108, 92, 231, 0.2),
                    0 8px 24px rgba(108, 92, 231, 0.15),
                    inset 0 1px 0 rgba(255, 255, 255, 0.9);
            border-color: rgba(108, 92, 231, 0.5);
        }

        .stat-card:hover::after {
            width: 150px;
            height: 150px;
            opacity: 0.4;
            background: var(--brand-glow);
        }

        .stat-card:active {
            transform: scale(0.98) translateY(-2px);
        }

        /* ========== CUSTOM SCROLLBAR ========== */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(108, 92, 231, 0.2);
            border-radius: 10px;
            transition: background 0.3s;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(108, 92, 231, 0.4);
        }

        /* ========== UTILITIES ========== */
        .flex { display: flex; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .flex-center { display: flex; align-items: center; justify-content: center; }
        .gap-sm { gap: 0.5rem; }
        .gap-md { gap: 1rem; }
        .gap-lg { gap: 1.5rem; }
        .text-muted { color: var(--text-muted); }
        .text-sm { font-size: 13px; }
        .text-lg { font-size: 16px; }
        .text-center { text-align: center; }
        .fw-500 { font-weight: 500; }
        .fw-600 { font-weight: 600; }
        .fw-700 { font-weight: 700; }
        .fw-800 { font-weight: 800; }
        .mt-1 { margin-top: 0.5rem; }
        .mt-2 { margin-top: 1rem; }
        .mt-3 { margin-top: 1.5rem; }
        .mb-1 { margin-bottom: 0.5rem; }
        .mb-2 { margin-bottom: 1rem; }
        .mb-3 { margin-bottom: 1.5rem; }
        .p-0 { padding: 0; }
        .rounded { border-radius: 16px; }
    </style>
</head>
<body>

<a href="#main-content" class="skip-link">Skip to main content</a>

<button class="hamburger" id="hamburger" onclick="toggleSidebar()" aria-label="Toggle navigation menu" aria-controls="sidebar" aria-expanded="false">
    <span></span>
</button>
<div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar" role="navigation" aria-label="Main navigation">
    <a th:href="@{/admin/dashboard}" class="logo">
        <div class="logo-icon">S</div>
        SCMS
    </a>

    <nav class="sidebar-nav">
        <div class="sidebar-nav-section">Main Menu</div>

        <a th:href="@{/admin/dashboard}" th:classappend="${currentPage == 'dashboard'} ? 'active'">
            <i class="fas fa-th-large"></i>
            <span>Dashboard</span>
        </a>

        <a th:href="@{/admin/students}" th:classappend="${currentPage == 'students'} ? 'active'">
            <i class="fas fa-user-graduate"></i>
            <span>Students</span>
        </a>

        <a th:href="@{/admin/courses}" th:classappend="${currentPage == 'courses'} ? 'active'">
            <i class="fas fa-book-open"></i>
            <span>Courses</span>
        </a>

        <div class="sidebar-nav-section">Management</div>

        <a th:href="@{/admin/enrollments}" th:classappend="${currentPage == 'enrollments'} ? 'active'">
            <i class="fas fa-clipboard-list"></i>
            <span>Enrollments</span>
        </a>

        <a th:href="@{/admin/lecturers}" th:classappend="${currentPage == 'lecturers'} ? 'active'">
            <i class="fas fa-chalkboard-teacher"></i>
            <span>Lecturers</span>
        </a>

        <a th:href="@{/admin/payments}" th:classappend="${currentPage == 'payments'} ? 'active'">
            <i class="fas fa-credit-card"></i>
            <span>Payments</span>
        </a>
    </nav>

    <div class="sidebar-footer">
        <div class="sidebar-user">
            <div class="sidebar-user-avatar">AD</div>
            <div class="sidebar-user-info">
                <div class="sidebar-user-name">Admin User</div>
                <div class="sidebar-user-role">Administrator</div>
            </div>
        </div>
    </div>
</aside>

<!-- MAIN CONTENT -->
<main class="main-content" id="main-content">
    <div layout:fragment="content">
        <!-- Content gets dynamic evaluation inside children views -->
    </div>
</main>

<script>
    function toggleSidebar() {
        var sidebar = document.getElementById('sidebar');
        var overlay = document.getElementById('sidebar-overlay');
        var hamburger = document.getElementById('hamburger');

        if (!sidebar || !overlay || !hamburger) return;

        var isCurrentlyOpen = sidebar.classList.contains('open');

        // Toggle states
        sidebar.classList.toggle('open');
        overlay.classList.toggle('show');
        hamburger.classList.toggle('open');

        // Update ARIA attributes
        hamburger.setAttribute('aria-expanded', !isCurrentlyOpen);

        // Prevent body scroll when sidebar is open on mobile
        if (!isCurrentlyOpen) {
            document.body.style.overflow = 'hidden';
        } else {
            document.body.style.overflow = '';
        }
    }

    // Initialize on DOM load
    document.addEventListener('DOMContentLoaded', function() {
        var hamburger = document.getElementById('hamburger');
        if (hamburger) {
            hamburger.setAttribute('aria-expanded', 'false');
        }

        // Close sidebar when clicking navigation links on mobile
        document.querySelectorAll('.sidebar a').forEach(function(link) {
            link.addEventListener('click', function() {
                if (window.innerWidth <= 1024) {
                    toggleSidebar();
                }
            });
        });

        // Close sidebar with Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                var sidebar = document.getElementById('sidebar');
                if (sidebar && sidebar.classList.contains('open')) {
                    toggleSidebar();
                }
            }
        });

        // Handle window resize
        var resizeTimeout;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(function() {
                if (window.innerWidth > 1024) {
                    var sidebar = document.getElementById('sidebar');
                    var overlay = document.getElementById('sidebar-overlay');
                    var hamburger = document.getElementById('hamburger');

                    if (sidebar && sidebar.classList.contains('open')) {
                        sidebar.classList.remove('open');
                        if (overlay) overlay.classList.remove('show');
                        if (hamburger) {
                            hamburger.classList.remove('open');
                            hamburger.setAttribute('aria-expanded', 'false');
                        }
                        document.body.style.overflow = '';
                    }
                }
            }, 250);
        });

        // Intersection Observer for scroll animations
        if ('IntersectionObserver' in window) {
            var observerOptions = {
                threshold: 0.1,
                rootMargin: '0px 0px -50px 0px'
            };

            var observer = new IntersectionObserver(function(entries) {
                entries.forEach(function(entry) {
                    if (entry.isIntersecting) {
                        entry.target.style.opacity = '1';
                        entry.target.style.transform = 'translateY(0)';
                        entry.target.style.filter = 'blur(0)';
                        observer.unobserve(entry.target);
                    }
                });
            }, observerOptions);

            // Observe cards and stat cards
            document.querySelectorAll('.card, .stat-card').forEach(function(el) {
                el.style.opacity = '0';
                el.style.transform = 'translateY(20px)';
                el.style.filter = 'blur(5px)';
                el.style.transition = 'opacity 0.6s ease-out, transform 0.6s var(--spring), filter 0.6s ease-out';
                observer.observe(el);
            });
        }
    });
</script>
</body>
</html>
