<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout :: layout('Course Form', 'courses', ~{::content})}">
<body>
<th:block th:fragment="content">

    <div class="page-header">
        <h1 th:text="${courseId == null} ? 'Add Course' : 'Edit Course'">
            Course Form
        </h1>
        <a th:href="@{/courses}" class="btn">← Back</a>
    </div>

    <div class="card">
        <form th:action="${courseId == null} ?
              @{/courses/save} : @{/courses/update/{id}(id=${courseId})}"
              method="post">

            <div class="form-grid">
                <div class="form-group">
                    <label>Course code</label>
                    <input type="text" name="courseCode"
                           th:value="${course.courseCode}"
                           placeholder="e.g. CS101" required/>
                </div>
                <div class="form-group">
                    <label>Course name</label>
                    <input type="text" name="courseName"
                           th:value="${course.courseName}"
                           placeholder="e.g. Introduction to Programming"
                           required/>
                </div>
                <div class="form-group">
                    <label>Department</label>
                    <input type="text" name="department"
                           th:value="${course.department}"
                           placeholder="e.g. Computer Science" required/>
                </div>
                <div class="form-group">
                    <label>Credits</label>
                    <input type="number" name="credits"
                           th:value="${course.credits}"
                           placeholder="e.g. 3" min="1" max="6" required/>
                </div>
                <div class="form-group">
                    <label>Type</label>
                    <select name="type" id="courseType"
                            onchange="toggleCourseFields()">
                        <option value="CORE"
                                th:selected="${course.type == 'CORE'}">
                            Core
                        </option>
                        <option value="ELECTIVE"
                                th:selected="${course.type == 'ELECTIVE'}">
                            Elective
                        </option>
                    </select>
                </div>
                <div class="form-group" id="mandatoryField">
                    <label>Is mandatory?</label>
                    <select name="isMandatory">
                        <option value="true">Yes</option>
                        <option value="false">No</option>
                    </select>
                </div>
                <div class="form-group" id="categoryField"
                     style="display:none">
                    <label>Elective category</label>
                    <input type="text" name="electiveCategory"
                           th:value="${course.electiveCategory}"
                           placeholder="e.g. AI & Data Science"/>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary"
                        th:text="${courseId == null} ? 'Add Course' : 'Update Course'">
                    Save
                </button>
                <a th:href="@{/courses}" class="btn">Cancel</a>
            </div>

        </form>
    </div>

</th:block>
</body>
</html>

<script>
    function toggleCourseFields() {
        const type = document.getElementById('courseType').value;
        document.getElementById('mandatoryField').style.display =
            type === 'CORE' ? 'block' : 'none';
        document.getElementById('categoryField').style.display =
            type === 'ELECTIVE' ? 'block' : 'none';
    }
    toggleCourseFields();
</script>
