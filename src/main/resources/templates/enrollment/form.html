<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout :: layout('Enroll Student', 'enrollments', ~{::content})}">
<body>
<th:block th:fragment="content">

    <div class="page-header">
        <h1>Enroll Student</h1>
        <a th:href="@{/enrollments}" class="btn">← Back</a>
    </div>

    <div class="card">
        <form th:action="@{/enrollments/save}" method="post">

            <div class="form-grid">
                <div class="form-group">
                    <label>Student</label>
                    <select name="studentId" required>
                        <option value="">-- Select Student --</option>
                        <option th:each="student : ${students}"
                                th:value="${student.id}"
                                th:text="${student.name}">
                        </option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Course</label>
                    <select name="courseId" required>
                        <option value="">-- Select Course --</option>
                        <option th:each="course : ${courses}"
                                th:value="${course.id}"
                                th:text="${course.courseName}">
                        </option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Enrollment type</label>
                    <select name="enrollmentType" required>
                        <option value="FULL_TIME">Full time</option>
                        <option value="PART_TIME">Part time</option>
                    </select>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    Enroll Student
                </button>
                <a th:href="@{/enrollments}" class="btn">Cancel</a>
            </div>

        </form>
    </div>

</th:block>
</body>
</html>
