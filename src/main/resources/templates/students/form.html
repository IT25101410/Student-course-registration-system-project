<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{common/layout :: layout(${studentId == null} ? 'Add Student' : 'Edit Student', 'students', ~{::content})}">
<body>
<th:block th:fragment="content">

    <!-- Bootstrap 5 CSS + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- Google Fonts for better typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand: #5b5bd6;
            --brand-light: #ededfc;
            --brand-dark: #3d3d9e;
            --accent: #e87040;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .sf-page {
            max-width: 800px;
            margin: 0 auto;
            opacity: 0;
            transform: translateY(20px);
            animation: sf-fadein 0.5s cubic-bezier(0.4, 0, 0.2, 1) 0.05s forwards;
        }

        @keyframes sf-fadein {
            to { opacity: 1; transform: translateY(0); }
        }

        .sf-header {
            margin-bottom: 1.75rem;
        }

        .sf-icon-wrap {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(91, 91, 214, 0.35);
        }

        .sf-icon-wrap i {
            font-size: 28px;
            color: white;
        }

        .sf-back {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sf-back:hover {
            transform: translateX(-4px);
        }

        .sf-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .sf-card-accent {
            height: 4px;
            background: linear-gradient(90deg, var(--brand), var(--accent));
        }

        .sf-steps {
            border-bottom: 1px solid rgba(91, 91, 214, 0.1);
            background: #f8f9ff;
        }

        .sf-step {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0.85rem 0;
            margin-right: 1.75rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #6c757d;
            border-bottom: 3px solid transparent;
            margin-bottom: -1px;
            cursor: default;
            transition: all 0.22s;
        }

        .sf-step.active {
            color: var(--brand);
            border-bottom-color: var(--brand);
        }

        .sf-step.done {
            color: #22c55e;
            border-bottom-color: #22c55e;
        }

        .sf-step-num {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(91, 91, 214, 0.12);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            transition: all 0.22s;
        }

        .sf-step.active .sf-step-num {
            background: var(--brand);
            color: white;
            box-shadow: 0 2px 8px rgba(91, 91, 214, 0.4);
        }

        .sf-step.done .sf-step-num {
            background: #22c55e;
            color: white;
        }

        .sf-section-label {
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--brand);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sf-section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(91, 91, 214, 0.12);
        }

        .sf-type-card {
            border: 2px solid #e4e4f0;
            border-radius: 12px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            background: #f8f9ff;
        }

        .sf-type-card:hover {
            border-color: rgba(91, 91, 214, 0.5);
            transform: translateY(-2px);
        }

        .sf-type-card.selected {
            border-color: var(--brand);
            background: var(--brand-light);
            box-shadow: 0 4px 14px rgba(91, 91, 214, 0.14);
        }

        .sf-type-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: #e4e4f0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.75rem;
            transition: all 0.2s;
        }

        .sf-type-icon i {
            font-size: 22px;
            color: #6c757d;
        }

        .sf-type-card.selected .sf-type-icon {
            background: var(--brand);
        }

        .sf-type-card.selected .sf-type-icon i {
            color: white;
        }

        .sf-type-title {
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .sf-type-desc {
            font-size: 0.75rem;
            color: #6c757d;
        }

        .sf-type-card.selected .sf-type-desc {
            color: var(--brand-dark);
        }

        .sf-type-card input[type="radio"] {
            display: none;
        }

        .sf-conditional {
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.28s;
        }

        .sf-conditional.visible {
            max-height: 500px;
            opacity: 1;
        }

        .sf-progress {
            background: #eeeef8;
            border-radius: 4px;
            height: 4px;
            margin-bottom: 1.5rem;
            overflow: hidden;
        }

        .sf-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--brand), var(--accent));
            border-radius: 4px;
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .error-field {
            border-color: #ef4444 !important;
            background-color: #fff5f5 !important;
        }

        .error-message {
            font-size: 0.75rem;
            color: #ef4444;
            margin-top: 0.25rem;
            display: block;
        }

        .toast-message {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 500;
            z-index: 2000;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @media (max-width: 576px) {
            .sf-step span:not(.sf-step-num) {
                display: none;
            }
            .sf-step {
                margin-right: 0.75rem;
            }
        }
    </style>

    <div class="sf-page">
        <!-- Header -->
        <div class="sf-header d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div class="d-flex align-items-center gap-3">
                <div class="sf-icon-wrap">
                    <i class="bi bi-person-badge"></i>
                </div>
                <div>
                    <h1 class="display-6 fw-bold mb-0" th:text="${studentId == null} ? 'Add Student' : 'Edit Student'">
                        Student Form
                    </h1>
                    <p class="text-muted mb-1" th:text="${studentId == null} ? 'Register a new student' : 'Update student information'">
                        Subtitle
                    </p>
                    <span class="badge" th:class="${studentId == null} ? 'bg-primary' : 'bg-warning'">
                        <i class="bi" th:class="${studentId == null} ? 'bi-plus-circle' : 'bi-pencil-square'"></i>
                        <span th:text="${studentId == null} ? 'New Record' : 'Editing Student'">Mode</span>
                    </span>
                </div>
            </div>
            <a th:href="@{/students}" class="btn btn-outline-secondary sf-back">
                <i class="bi bi-arrow-left"></i> Back to List
            </a>
        </div>

        <!-- Main Form Card -->
        <div class="card sf-card">
            <div class="sf-card-accent"></div>

            <!-- Steps -->
            <div class="sf-steps px-4 d-flex">
                <div class="sf-step active" id="step1">
                    <div class="sf-step-num">1</div>
                    <span>Personal Info</span>
                </div>
                <div class="sf-step" id="step2">
                    <div class="sf-step-num">2</div>
                    <span>Contact Details</span>
                </div>
                <div class="sf-step" id="step3">
                    <div class="sf-step-num">3</div>
                    <span>Academic Info</span>
                </div>
            </div>

            <!-- ✅ FIX: Use {id} path variable syntax, not (id=...) query param syntax -->
            <form th:action="${studentId == null} ? @{/students/save} : @{/students/update/{id}(id=${studentId})}"
                  method="post" id="sf-form" novalidate>

                <div class="card-body p-4">
                    <!-- Progress Bar -->
                    <div class="sf-progress">
                        <div class="sf-progress-bar" id="sf-progress-bar"></div>
                    </div>

                    <!-- Personal Information Section -->
                    <div class="sf-section-label">
                        <i class="bi bi-person-circle"></i> Personal Information
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-12">
                            <label class="form-label fw-semibold">
                                Full Name <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0">
                                    <i class="bi bi-person text-muted"></i>
                                </span>
                                <input type="text" id="f-name" name="name"
                                       class="form-control border-start-0 ps-0"
                                       th:value="${student.name}"
                                       placeholder="Enter full name" required>
                            </div>
                            <div class="error-message" id="nameError"></div>
                        </div>
                    </div>

                    <!-- Contact Information Section -->
                    <div class="sf-section-label mt-4">
                        <i class="bi bi-envelope-paper"></i> Contact Information
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">
                                Email Address <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0">
                                    <i class="bi bi-envelope text-muted"></i>
                                </span>
                                <input type="email" id="f-email" name="email"
                                       class="form-control border-start-0 ps-0"
                                       th:value="${student.email}"
                                       placeholder="name@example.com" required>
                            </div>
                            <div class="error-message" id="emailError"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">
                                Phone Number <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0">
                                    <i class="bi bi-telephone text-muted"></i>
                                </span>
                                <input type="tel" id="f-phone" name="phone"
                                       class="form-control border-start-0 ps-0"
                                       th:value="${student.phone}"
                                       placeholder="077XXXXXXX" required>
                            </div>
                            <div class="error-message" id="phoneError"></div>
                        </div>
                    </div>

                    <!-- Student Type Section -->
                    <div class="sf-section-label mt-4">
                        <i class="bi bi-mortarboard"></i> Student Type <span class="text-danger">*</span>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <div class="sf-type-card" id="card-ug">
                                <input type="radio" name="type" value="UNDERGRADUATE"
                                       th:checked="${student.type == 'UNDERGRADUATE' or student.type == null}"/>
                                <div class="sf-type-icon">
                                    <i class="bi bi-book"></i>
                                </div>
                                <div class="sf-type-title">Undergraduate</div>
                                <div class="sf-type-desc">Year 1 – 4 programme</div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="sf-type-card" id="card-pg">
                                <input type="radio" name="type" value="POSTGRADUATE"
                                       th:checked="${student.type == 'POSTGRADUATE'}"/>
                                <div class="sf-type-icon">
                                    <i class="bi bi-trophy"></i>
                                </div>
                                <div class="sf-type-title">Postgraduate</div>
                                <div class="sf-type-desc">Master's / PhD research</div>
                            </div>
                        </div>
                    </div>

                    <!-- Conditional Academic Details -->
                    <div class="sf-conditional" id="yearBlock">
                        <div class="sf-section-label mt-3">
                            <i class="bi bi-calendar-check"></i> Academic Details
                        </div>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">
                                    Year of Study <span class="text-danger">*</span>
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0">
                                        <i class="bi bi-calendar text-muted"></i>
                                    </span>
                                    <input type="number" id="f-year" name="yearOfStudy"
                                           class="form-control border-start-0 ps-0"
                                           th:value="${student.yearOfStudy}"
                                           placeholder="1 – 4" min="1" max="4">
                                </div>
                                <div class="error-message" id="yearError"></div>
                            </div>
                        </div>
                    </div>

                    <div class="sf-conditional" id="researchBlock">
                        <div class="sf-section-label mt-3">
                            <i class="bi bi-search"></i> Research Details
                        </div>
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label fw-semibold">
                                    Research Area <span class="text-danger">*</span>
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0">
                                        <i class="bi bi-lightbulb text-muted"></i>
                                    </span>
                                    <input type="text" id="f-research" name="researchArea"
                                           class="form-control border-start-0 ps-0"
                                           th:value="${student.researchArea}"
                                           placeholder="e.g., Machine Learning, AI, Data Science">
                                </div>
                                <div class="error-message" id="researchError"></div>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- Form Actions -->
                <div class="card-footer bg-light border-0 p-4">
                    <div class="d-flex gap-3 justify-content-end">
                        <a th:href="@{/students}" class="btn btn-outline-secondary px-4">
                            <i class="bi bi-x-circle"></i> Cancel
                        </a>
                        <button type="submit" id="sf-submit"
                                th:class="${studentId == null} ? 'btn btn-primary px-4 text-white' : 'btn btn-warning px-4 text-white'">
                            <i class="bi" th:class="${studentId == null} ? 'bi-check-circle' : 'bi-pencil-square'"></i>
                            <span th:text="${studentId == null} ? 'Add Student' : 'Update Student'">Save</span>
                        </button>
                    </div>
                </div>

            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function showMessage(text, isError = false) {
            let toast = document.querySelector('.toast-message');
            if(toast) toast.remove();
            const div = document.createElement('div');
            div.className = 'toast-message';
            div.style.background = isError ? '#ef4444' : '#22c55e';
            div.innerHTML = `<i class="bi ${isError ? 'bi-exclamation-triangle' : 'bi-check-circle'} me-2"></i>${text}`;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 3000);
        }

        function onTypeChange(radio) {
            document.getElementById('card-ug').classList.toggle('selected', radio.value === 'UNDERGRADUATE');
            document.getElementById('card-pg').classList.toggle('selected', radio.value === 'POSTGRADUATE');

            const yearBlock = document.getElementById('yearBlock');
            const researchBlock = document.getElementById('researchBlock');

            if(radio.value === 'UNDERGRADUATE') {
                yearBlock.classList.add('visible');
                researchBlock.classList.remove('visible');
            } else {
                yearBlock.classList.remove('visible');
                researchBlock.classList.add('visible');
            }

            updateProgress();
            clearFieldErrors();
        }

        function clearFieldErrors() {
            const fields = ['name', 'email', 'phone', 'year', 'research'];
            fields.forEach(f => {
                const errDiv = document.getElementById(f + 'Error');
                if(errDiv) errDiv.innerText = '';
                const inputField = document.getElementById(`f-${f}`);
                if(inputField) inputField.classList.remove('error-field');
            });
        }

        function validateForm() {
            let isValid = true;
            const name = document.getElementById('f-name').value.trim();
            const email = document.getElementById('f-email').value.trim();
            const phone = document.getElementById('f-phone').value.trim();
            const typeRadio = document.querySelector('input[name="type"]:checked');
            const type = typeRadio ? typeRadio.value : null;

            clearFieldErrors();

            if (!name) {
                document.getElementById('nameError').innerText = 'Full name is required';
                document.getElementById('f-name').classList.add('error-field');
                isValid = false;
            } else if (name.length < 2) {
                document.getElementById('nameError').innerText = 'Name must be at least 2 characters';
                document.getElementById('f-name').classList.add('error-field');
                isValid = false;
            }

            const emailRegex = /^[^\s@]+@([^\s@]+\.)+[^\s@]+$/;
            if (!email) {
                document.getElementById('emailError').innerText = 'Email address is required';
                document.getElementById('f-email').classList.add('error-field');
                isValid = false;
            } else if (!emailRegex.test(email)) {
                document.getElementById('emailError').innerText = 'Enter a valid email address';
                document.getElementById('f-email').classList.add('error-field');
                isValid = false;
            }

            if (!phone) {
                document.getElementById('phoneError').innerText = 'Phone number is required';
                document.getElementById('f-phone').classList.add('error-field');
                isValid = false;
            } else if (phone.length < 8) {
                document.getElementById('phoneError').innerText = 'Enter a valid phone number';
                document.getElementById('f-phone').classList.add('error-field');
                isValid = false;
            }

            if (!type) {
                showMessage('Please select a student type', true);
                isValid = false;
            }

            if (type === 'UNDERGRADUATE') {
                const year = document.getElementById('f-year').value.trim();
                if (!year) {
                    document.getElementById('yearError').innerText = 'Year of study is required';
                    document.getElementById('f-year').classList.add('error-field');
                    isValid = false;
                } else {
                    const yearNum = parseInt(year, 10);
                    if (isNaN(yearNum) || yearNum < 1 || yearNum > 4) {
                        document.getElementById('yearError').innerText = 'Year must be between 1 and 4';
                        document.getElementById('f-year').classList.add('error-field');
                        isValid = false;
                    }
                }
            } else if (type === 'POSTGRADUATE') {
                const research = document.getElementById('f-research').value.trim();
                if (!research) {
                    document.getElementById('researchError').innerText = 'Research area is required';
                    document.getElementById('f-research').classList.add('error-field');
                    isValid = false;
                } else if (research.length < 3) {
                    document.getElementById('researchError').innerText = 'Research area too short (min 3 characters)';
                    document.getElementById('f-research').classList.add('error-field');
                    isValid = false;
                }
            }

            return isValid;
        }

        function updateProgress() {
            const typeRadio = document.querySelector('input[name="type"]:checked');
            const type = typeRadio ? typeRadio.value : 'UNDERGRADUATE';
            const name = document.getElementById('f-name').value.trim();
            const email = document.getElementById('f-email').value.trim();
            const phone = document.getElementById('f-phone').value.trim();

            let extra = '';
            if(type === 'UNDERGRADUATE') {
                extra = document.getElementById('f-year').value.trim();
            } else {
                extra = document.getElementById('f-research').value.trim();
            }

            let filledCount = 0;
            if(name) filledCount++;
            if(email) filledCount++;
            if(phone) filledCount++;
            if(extra) filledCount++;

            const percent = Math.round((filledCount / 4) * 100);
            document.getElementById('sf-progress-bar').style.width = percent + '%';

            const step1 = document.getElementById('step1');
            const step2 = document.getElementById('step2');
            const step3 = document.getElementById('step3');

            setStep(step1, !!name, !name);
            setStep(step2, !!(email && phone), !!(name && !(email && phone)));

            const academicComplete = (type === 'UNDERGRADUATE' && !!extra) || (type === 'POSTGRADUATE' && !!extra);
            setStep(step3, academicComplete, (filledCount >= 2 && !academicComplete));
        }

        function setStep(el, done, active) {
            if(done) {
                el.classList.add('done');
                el.classList.remove('active');
            } else if(active) {
                el.classList.add('active');
                el.classList.remove('done');
            } else {
                el.classList.remove('done', 'active');
            }
        }

        const form = document.getElementById('sf-form');
        const submitBtn = document.getElementById('sf-submit');

        if(form) {
            form.addEventListener('submit', function(event) {
                if (!validateForm()) {
                    event.preventDefault();
                    showMessage('Please fix the errors before submitting', true);
                    const firstError = document.querySelector('.error-field');
                    if(firstError) firstError.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    return false;
                }

                if(submitBtn) {
                    submitBtn.disabled = true;
                    submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Saving...';
                }
                return true;
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            const checkedRadio = document.querySelector('input[name="type"]:checked');
            if(checkedRadio) {
                document.getElementById('card-ug').classList.toggle('selected', checkedRadio.value === 'UNDERGRADUATE');
                document.getElementById('card-pg').classList.toggle('selected', checkedRadio.value === 'POSTGRADUATE');

                if(checkedRadio.value === 'UNDERGRADUATE') {
                    document.getElementById('yearBlock').classList.add('visible');
                } else {
                    document.getElementById('researchBlock').classList.add('visible');
                }
            } else {
                const defaultRadio = document.querySelector('input[name="type"][value="UNDERGRADUATE"]');
                if(defaultRadio) {
                    defaultRadio.checked = true;
                    document.getElementById('card-ug').classList.add('selected');
                    document.getElementById('yearBlock').classList.add('visible');
                }
            }

            const inputs = document.querySelectorAll('#sf-form input');
            inputs.forEach(el => el.addEventListener('input', updateProgress));

            document.getElementById('card-ug')?.addEventListener('click', function() {
                const radio = this.querySelector('input[type="radio"]');
                if(radio) { radio.checked = true; onTypeChange(radio); }
            });

            document.getElementById('card-pg')?.addEventListener('click', function() {
                const radio = this.querySelector('input[type="radio"]');
                if(radio) { radio.checked = true; onTypeChange(radio); }
            });

            updateProgress();
        });
    </script>

</th:block>
</body>
</html>
